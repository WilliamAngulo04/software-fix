{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">{{ titulo }}</h1>
        {% if ayuda %}<p class="text-body-secondary small">{{ ayuda }}</p>{% endif %}
        <form method="post" enctype="multipart/form-data" class="mt-3">
          {% csrf_token %}
          {% include '_campos.html' %}
          <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
